org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App identity.
# The application ID is permanent once people install the app (an APK with another ID installs as a separate app),
# and Firebase and the Google sign-in Android clients are registered with it. Chosen 2026-11-17. The Kotlin
# package and namespace stay com.expenses.app; only the installed app's ID changed.
app.applicationId=com.akhilux.xpense
# Host used for invite and pay links: the Cloudflare Pages project xpense-pay (temporary name, chosen 2026-11-17).
# It can change freely until a real link reaches a friend; after that, changing it breaks links already sent.
app.linkHost=xpense-pay.pages.dev

# Server, sign-in and push (docs/server.md 9.8; docs/server-setup.md says where each value comes from).
# The public server's values are committed, so a release build works from a clean clone; none of them is secret.
# ~/.gradle/gradle.properties or ORG_GRADLE_PROJECT_<name> environment variables override this file, for example to
# point a build at your own server. A release build fails while apiBaseUrl, googleWebClientId or linkHost holds a
# placeholder. Debug builds always use the local server at http://10.0.2.2:8787.
app.apiBaseUrl=https://xpense-api.akhilu-design.workers.dev
# The OAuth "Web application" client id of the Google Cloud project (GOOGLE_WEB_CLIENT_ID in server/wrangler.toml).
# Empty: Google sign-in is off.
app.googleWebClientId=661675315227-k5fpgulhid1nnbn61c0gs51p3f4ng3jp.apps.googleusercontent.com
# Firebase Cloud Messaging (push). Not committed: they belong to the maintainer's Firebase app, so a self-built app
# has no push. All four empty: push is off and the app syncs when opened and every 12 hours.
app.fcm.projectId=
app.fcm.applicationId=
app.fcm.apiKey=
app.fcm.senderId=
