<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <title>Your share</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/pay.css">
  <script src="/config.js"></script>
  <script type="module" src="/pay.js"></script>
</head>
<body>
  <div class="page">
    <main id="main" class="content" aria-busy="true" tabindex="-1">
      <p class="visually-hidden" role="status">Loading what you owe</p>
      <div class="from" aria-hidden="true">
        <div class="placeholder ph-avatar"></div>
        <div class="placeholder ph-line ph-w150"></div>
      </div>
      <div class="placeholder ph-heading ph-heading-1" aria-hidden="true"></div>
      <div class="placeholder ph-heading ph-heading-2" aria-hidden="true"></div>
      <div class="placeholder ph-card" aria-hidden="true"></div>
      <div class="details" aria-hidden="true">
        <div class="info-row">
          <div class="placeholder ph-bubble"></div>
          <div class="ph-lines"><div class="placeholder ph-line ph-w140"></div><div class="placeholder ph-w90"></div></div>
        </div>
        <div class="info-row">
          <div class="placeholder ph-bubble"></div>
          <div class="ph-lines"><div class="placeholder ph-line ph-w140"></div><div class="placeholder ph-w90"></div></div>
        </div>
      </div>
      <noscript><p class="noscript">Turn on JavaScript to see what you owe.</p></noscript>
    </main>
    <footer id="footer" class="footer"></footer>
  </div>
</body>
</html>
